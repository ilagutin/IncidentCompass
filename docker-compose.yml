name: incidentcompass

x-incidentcompass-ai-env: &incidentcompass-ai-env
  IncidentCompass__ModelGateway__Provider: OpenAICompatible
  IncidentCompass__ModelGateway__OpenAiCompatible__BaseUrl: ${INCIDENTCOMPASS_LLM_BASE_URL:-http://host.docker.internal:1234}
  IncidentCompass__ModelGateway__OpenAiCompatible__ChatCompletionsPath: ${INCIDENTCOMPASS_LLM_CHAT_COMPLETIONS_PATH:-/v1/chat/completions}
  IncidentCompass__ModelGateway__OpenAiCompatible__ApiKey: ${INCIDENTCOMPASS_LLM_API_KEY:-local-dev-key}
  IncidentCompass__ModelGateway__OpenAiCompatible__AllowInsecureHttpForLoopback: "true"
  IncidentCompass__Embeddings__Provider: OpenAICompatible
  IncidentCompass__Embeddings__OpenAiCompatible__BaseUrl: ${INCIDENTCOMPASS_EMBEDDINGS_BASE_URL:-http://host.docker.internal:1234}
  IncidentCompass__Embeddings__OpenAiCompatible__EmbeddingsPath: ${INCIDENTCOMPASS_EMBEDDINGS_PATH:-/v1/embeddings}
  IncidentCompass__Embeddings__OpenAiCompatible__ApiKey: ${INCIDENTCOMPASS_EMBEDDINGS_API_KEY:-local-dev-key}
  IncidentCompass__Embeddings__OpenAiCompatible__AllowInsecureHttpForLoopback: "true"
  INCIDENTCOMPASS_LLM_BASE_URL: ${INCIDENTCOMPASS_LLM_BASE_URL:-http://host.docker.internal:1234}
  INCIDENTCOMPASS_LLM_MODEL: ${INCIDENTCOMPASS_LLM_MODEL:-local-model}
  INCIDENTCOMPASS_EMBEDDINGS_MODEL: ${INCIDENTCOMPASS_EMBEDDINGS_MODEL:-local-embedding-model}

services:
  postgres:
    image: pgvector/pgvector:pg16
    # Defaults are local-only demo values. Override from an ignored .env file
    # or shell variables; do not copy them into deployed runtime configuration.
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incidentcompass}
      POSTGRES_USER: ${POSTGRES_USER:-incidentcompass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-incidentcompass_dev_password}
    ports:
      - "${IC_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    # Checked over TCP, not the Unix socket: on a fresh volume the image entrypoint first
    # brings up a temporary socket-only server, and a socket check reports ready against it
    # while port 5432 still refuses the connection the API actually makes.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-incidentcompass} -d ${POSTGRES_DB:-incidentcompass}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: src/IncidentCompass.Api/Dockerfile
    environment:
      <<: *incidentcompass-ai-env
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__IncidentCompass: Host=postgres;Port=5432;Database=${POSTGRES_DB:-incidentcompass};Username=${POSTGRES_USER:-incidentcompass};Password=${POSTGRES_PASSWORD:-incidentcompass_dev_password}
      IncidentCompass__ConfigSource__Path: /app/config/incidentcompass.config.json
      IncidentCompass__Memory__Seed__TenantId: ${INCIDENTCOMPASS_MEMORY_SEED_TENANT_ID:-local}
      IncidentCompass__Memory__Seed__Owner: ${INCIDENTCOMPASS_MEMORY_SEED_OWNER:-default}
      IncidentCompass__Memory__Seed__SourceDirectory: /app/samples
    ports:
      - "${IC_API_PORT:-5198}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://localhost:8080/health >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: on-failure

  worker:
    build:
      context: .
      dockerfile: src/IncidentCompass.Worker/Dockerfile
    environment:
      <<: *incidentcompass-ai-env
      DOTNET_ENVIRONMENT: Development
      ConnectionStrings__IncidentCompass: Host=postgres;Port=5432;Database=${POSTGRES_DB:-incidentcompass};Username=${POSTGRES_USER:-incidentcompass};Password=${POSTGRES_PASSWORD:-incidentcompass_dev_password}
      IncidentCompass__ConfigSource__Path: /app/config/incidentcompass.config.json
      IncidentCompass__Memory__Seed__Enabled: "true"
      IncidentCompass__Memory__Seed__TenantId: ${INCIDENTCOMPASS_MEMORY_SEED_TENANT_ID:-local}
      IncidentCompass__Memory__Seed__Owner: ${INCIDENTCOMPASS_MEMORY_SEED_OWNER:-default}
      IncidentCompass__Memory__Seed__SourceDirectory: /app/samples
      IncidentCompass__Worker__PollIntervalSeconds: "1"
      IncidentCompass__Worker__RetryDelaySeconds: "2"
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "grep -azq 'IncidentCompass.Worker.dll' /proc/1/cmdline"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    restart: on-failure

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    profiles: ["demo"]
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./infra/otel/collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      api:
        condition: service_healthy
    restart: on-failure
  tester:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: src/IncidentCompass.Tester/Dockerfile
    environment:
      INCIDENTCOMPASS_TESTER_BASE_URL: http://api:8080
      INCIDENTCOMPASS_TESTER_PUBLIC_BASE_URL: http://localhost:${IC_API_PORT:-5198}
      INCIDENTCOMPASS_TESTER_OTLP_TRACES_ENDPOINT: http://otel-collector:4318/v1/traces
    depends_on:
      api:
        condition: service_healthy
      worker:
        condition: service_healthy
      otel-collector:
        condition: service_started
    restart: "no"

volumes:
  postgres-data:
