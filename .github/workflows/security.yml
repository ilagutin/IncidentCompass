name: security

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore IncidentCompass.slnx --locked-mode

      - name: Vulnerability scan
        shell: pwsh
        run: ./scripts/package-vulnerability-gate.ps1

      # The two CodeQL steps are the only actions in this repository that track a major tag instead
      # of a full SHA, and that float is deliberate. A commit of github/codeql-action pins the CodeQL
      # bundle it downloads, so a SHA pin would freeze the analysis engine and the query pack at the
      # day it was taken and quietly stop finding anything newer. The action is published by GitHub
      # from the same trust boundary that runs the workflow, so the pin buys correspondingly less
      # here than it does for a third-party action.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - name: Analyze
        uses: github/codeql-action/analyze@v4
