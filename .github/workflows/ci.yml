name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: solution build, gates and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore IncidentCompass.slnx --locked-mode

      - name: Build
        run: dotnet build IncidentCompass.slnx --configuration Release --no-restore

      - name: Format
        run: dotnet format IncidentCompass.slnx --verify-no-changes --verbosity minimal

      - name: Code organization gate
        shell: pwsh
        run: ./scripts/code-organization-gate.ps1

      - name: Internal reference gate
        shell: pwsh
        run: ./scripts/internal-reference-gate.ps1

      - name: Vulnerability scan
        shell: pwsh
        run: ./scripts/package-vulnerability-gate.ps1

      - name: Test
        env:
          INCIDENTCOMPASS_REQUIRE_DOCKER_TESTS: "true"
        run: dotnet test --solution IncidentCompass.slnx --configuration Release --no-build

  container-images:
    name: demo container images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build demo container images
        run: docker compose --profile demo build api worker tester

  # `ci / build` is the single required status check on main. It runs nothing itself: it succeeds
  # only when every job above it succeeded, so one entry in branch protection covers all of them and
  # a newly added job is covered by adding it to `needs` here. Branch protection matches this check
  # by name, so renaming the job means updating branch protection in the same change; the other jobs
  # in this workflow carry descriptive names precisely because they are not the required one.
  build:
    name: build
    runs-on: ubuntu-latest
    needs:
      - build-and-test
      - container-images
    if: ${{ always() }}

    steps:
      - name: Enforce required CI gates
        env:
          BUILD_AND_TEST_RESULT: ${{ needs.build-and-test.result }}
          CONTAINER_IMAGES_RESULT: ${{ needs.container-images.result }}
        run: |
          echo "build-and-test: ${BUILD_AND_TEST_RESULT}"
          echo "container-images: ${CONTAINER_IMAGES_RESULT}"

          if [ "${BUILD_AND_TEST_RESULT}" != "success" ] || [ "${CONTAINER_IMAGES_RESULT}" != "success" ]; then
            echo "One or more required CI gates did not succeed."
            exit 1
          fi
