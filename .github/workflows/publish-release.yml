name: publish-release

on:
  # Primary path: a squash merge of a release PR updates VERSION on main.
  # The workflow reads VERSION, tags the current main HEAD and publishes the release.
  push:
    branches:
      - main
    paths:
      - VERSION
  # Recovery path: replay publication from main with the current VERSION if an
  # automatic run must be repaired.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. v0.3.0 or 0.3.0. Run from main."
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-release-main
  cancel-in-progress: false

jobs:
  verify:
    outputs:
      version: ${{ steps.version.outputs.version }}
      notes_file: ${{ steps.version.outputs.notes_file }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Verify exact release checkout
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EVENT_SHA}"

      # Resolve the release version and require its release-notes file BEFORE the
      # build/format/gates/tests, so a bad version or missing notes fail fast.
      # Main pushes reach this workflow only when VERSION changes. Dispatch is a
      # recovery replay on main and must match the current VERSION. Both paths run
      # the complete release gate on this checkout before one workflow creates a tag.
      - name: Resolve and validate release version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            if [[ ! -f VERSION ]]; then
              echo "::error::Missing VERSION. Release PRs must update VERSION before merging to main."
              exit 1
            fi

            version_file="$(tr -d '[:space:]' < VERSION)"
            if [[ ! "${version_file}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::VERSION must contain SemVer without a leading v, e.g. 0.3.0."
              exit 1
            fi

            version="v${version_file}"
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
              echo "::error::workflow_dispatch releases must run from main, got '${GITHUB_REF}'."
              exit 1
            fi

            raw_version="${DISPATCH_VERSION}"
            if [[ "${raw_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              version="v${raw_version}"
            elif [[ "${raw_version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              version="${raw_version}"
            else
              echo "::error::Version '${raw_version}' must look like v1.2.3 or 1.2.3."
              exit 1
            fi

            if [[ ! -f VERSION ]] || [[ "${version}" != "v$(tr -d '[:space:]' < VERSION)" ]]; then
              echo "::error::Dispatch version '${version}' must match VERSION at the current main HEAD."
              exit 1
            fi
          else
            echo "::error::Unsupported release event '${GITHUB_EVENT_NAME}'."
            exit 1
          fi

          if [[ ! "${version}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version '${version}' must look like v1.2.3."
            exit 1
          fi

          notes_file="docs/release-notes-${version}.md"
          if [[ ! -f "${notes_file}" ]]; then
            echo "::error::Missing ${notes_file}. Add it in the release PR before publishing ${version}."
            exit 1
          fi

          if git rev-parse --verify --quiet "refs/tags/${version}" >/dev/null; then
            tagged_sha="$(git rev-list -n 1 "refs/tags/${version}")"
            head_sha="$(git rev-parse HEAD)"
            if [[ "${tagged_sha}" != "${head_sha}" ]]; then
              echo "::error::Tag '${version}' already exists at ${tagged_sha}, but current HEAD is ${head_sha}."
              exit 1
            fi
          fi

          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "notes_file=${notes_file}" >> "${GITHUB_OUTPUT}"

      # Locked restore is the only path. Directory.Build.props sets RestorePackagesWithLockFile,
      # every project commits a packages.lock.json, and a missing or stale one must fail the
      # release rather than silently resolve a different graph.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore IncidentCompass.slnx --locked-mode

      - name: Build
        run: dotnet build IncidentCompass.slnx --configuration Release --no-restore

      - name: Format
        run: dotnet format IncidentCompass.slnx --verify-no-changes --verbosity minimal

      - name: Code organization gate
        shell: pwsh
        run: ./scripts/code-organization-gate.ps1

      - name: Vulnerability scan
        shell: pwsh
        run: ./scripts/package-vulnerability-gate.ps1

      - name: Full release test gate
        env:
          INCIDENTCOMPASS_REQUIRE_DOCKER_TESTS: "true"
        run: dotnet test --solution IncidentCompass.slnx --configuration Release --no-build
  publish:
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact verified release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Verify exact release checkout
        env:
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${EVENT_SHA}"

      - name: Tag verified release commit
        env:
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          NOTES_FILE: ${{ needs.verify.outputs.notes_file }}
        run: |
          set -euo pipefail
          test -f "${NOTES_FILE}"
          version="${RELEASE_VERSION}"
          if git rev-parse --verify --quiet "refs/tags/${version}" >/dev/null; then
            test "$(git rev-list -n 1 "refs/tags/${version}")" = "$(git rev-parse HEAD)"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${version}" -m "${version}"
            git push origin "refs/tags/${version}"
          fi
          echo "RELEASE_VERSION=${version}" >> "${GITHUB_ENV}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_VERSION}" >/dev/null 2>&1; then
            gh release create "${RELEASE_VERSION}" --title "${RELEASE_VERSION}" --notes-file "docs/release-notes-${RELEASE_VERSION}.md"
          fi
