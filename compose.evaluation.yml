# The evaluation triage configuration is mounted at the same path it occupies in the repository,
# so the relative instruction and schema references it declares resolve against the image's own
# /app/config directory exactly as they resolve against config/ on a developer machine. This file
# chooses where the configuration is read from; it is not what makes the configuration loadable.
services:
  postgres:
    ports: !reset []

  api:
    ports: !reset []
    environment:
      IncidentCompass__ConfigSource__Path: /app/evaluations/triage/incidentcompass.config.json
      # Same model default as the tester below, so the corpus status judges the route the Worker embeds under.
      INCIDENTCOMPASS_EMBEDDINGS_MODEL: ${INCIDENTCOMPASS_EMBEDDINGS_MODEL:-local-embedding-model}
      IncidentCompass__ModelGateway__OpenAiCompatible__TimeoutSeconds: ${INCIDENTCOMPASS_EVALUATION_PROVIDER_TIMEOUT_SECONDS:-420}
      IncidentCompass__Embeddings__OpenAiCompatible__TimeoutSeconds: ${INCIDENTCOMPASS_EVALUATION_PROVIDER_TIMEOUT_SECONDS:-420}
    volumes:
      - ./evaluations/triage/incidentcompass.config.json:/app/evaluations/triage/incidentcompass.config.json:ro

  worker:
    environment:
      IncidentCompass__ConfigSource__Path: /app/evaluations/triage/incidentcompass.config.json
      # The evaluation configuration's memory route names the OpenAI-compatible provider, so this
      # stack keeps that embedding adapter rather than the base file's in-process default.
      IncidentCompass__Embeddings__Provider: OpenAICompatible
      # The base file defaults the model to the in-process model's id, which an OpenAI-compatible server
      # does not serve. The evaluation route's own default is used instead, as the tester below uses it.
      # The route names local-oai literally, so INCIDENTCOMPASS_EMBEDDINGS_PROVIDER_ID is not read here.
      INCIDENTCOMPASS_EMBEDDINGS_MODEL: ${INCIDENTCOMPASS_EMBEDDINGS_MODEL:-local-embedding-model}
      IncidentCompass__ModelGateway__OpenAiCompatible__TimeoutSeconds: ${INCIDENTCOMPASS_EVALUATION_PROVIDER_TIMEOUT_SECONDS:-420}
      IncidentCompass__Embeddings__OpenAiCompatible__TimeoutSeconds: ${INCIDENTCOMPASS_EVALUATION_PROVIDER_TIMEOUT_SECONDS:-420}
      IncidentCompass__Telegram__Enabled: "false"
      IncidentCompass__Telegram__BotToken: ""
      IncidentCompass__Tickets__GitHub__Token: ""
    volumes:
      - ./evaluations/triage/incidentcompass.config.json:/app/evaluations/triage/incidentcompass.config.json:ro

  tester:
    environment:
      INCIDENTCOMPASS_TESTER_EVALUATION_CORPUS: /app/evaluations/triage/corpus-v1.json
      INCIDENTCOMPASS_TESTER_EVALUATION_CONFIG: /app/evaluations/triage/incidentcompass.config.json
      INCIDENTCOMPASS_TESTER_EVALUATION_OUTPUT: ${INCIDENTCOMPASS_TESTER_EVALUATION_OUTPUT:-/artifacts/triage-evaluation-result-v3.json}
      INCIDENTCOMPASS_TESTER_EVALUATION_RUNS: ${INCIDENTCOMPASS_TESTER_EVALUATION_RUNS:-3}
      INCIDENTCOMPASS_TESTER_EVALUATION_REVISION: ${INCIDENTCOMPASS_TESTER_EVALUATION_REVISION:-unknown}
      INCIDENTCOMPASS_TESTER_EVALUATION_CONTENT_IDENTITY: ${INCIDENTCOMPASS_TESTER_EVALUATION_CONTENT_IDENTITY:-unknown}
      INCIDENTCOMPASS_TESTER_EVALUATION_CONTENT_DIRTY: ${INCIDENTCOMPASS_TESTER_EVALUATION_CONTENT_DIRTY:-true}
      INCIDENTCOMPASS_TESTER_EVALUATION_ATTEMPT_TIMEOUT_SECONDS: ${INCIDENTCOMPASS_EVALUATION_ATTEMPT_TIMEOUT_SECONDS:-660}
      INCIDENTCOMPASS_LLM_BASE_URL: ${INCIDENTCOMPASS_LLM_BASE_URL:-http://host.docker.internal:1234}
      INCIDENTCOMPASS_LLM_MODEL: ${INCIDENTCOMPASS_LLM_MODEL:-local-model}
      INCIDENTCOMPASS_EMBEDDINGS_MODEL: ${INCIDENTCOMPASS_EMBEDDINGS_MODEL:-local-embedding-model}
      INCIDENTCOMPASS_TESTER_EVALUATION_EMPTY_ACTION_GRANTS: "true"
      INCIDENTCOMPASS_TESTER_EVALUATION_EXTERNAL_ACTION_CREDENTIALS: "false"
    volumes:
      - ${INCIDENTCOMPASS_EVALUATION_ARTIFACTS_DIRECTORY:-./artifacts/evaluation}:/artifacts
      - ./evaluations/triage/incidentcompass.config.json:/app/evaluations/triage/incidentcompass.config.json:ro
